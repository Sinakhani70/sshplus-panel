# XcodeGen spec:  brew install xcodegen && xcodegen generate   (then open CKClient.xcodeproj)
# Edit the five values marked  <-- before generating.
name: CKClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                       # <-- your Apple Developer Team ID (10 characters)
    BUNDLE_ID: com.example.ckclient            # <-- a unique reverse-DNS id you own
    APP_GROUP: group.com.example.ckclient      # <-- "group." + the id above
    KEYCHAIN_GROUP: com.example.ckclient.shared # <-- the id above + ".shared"
targets:
  CKClient:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/CKClient.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PacketTunnel
        embed: true
      - framework: build/Ckcore.xcframework   # made by scripts/build-core.sh
        embed: false
      - sdk: libresolv.tbd
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - framework: build/Ckcore.xcframework
        embed: false
      - sdk: libresolv.tbd
