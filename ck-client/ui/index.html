<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CK Client</title>
<style>
:root{--bg:#0f1218;--card:#181d27;--line:#262d3b;--txt:#e8ecf3;--dim:#8a94a7;--acc:#4f8cff;--ok:#2ecc8f;--bad:#ff5d6c;--warn:#f5b942}
@media (prefers-color-scheme: light){:root{--bg:#f3f5f9;--card:#fff;--line:#dde2ec;--txt:#1b2230;--dim:#667085}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 "Segoe UI",Tahoma,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
h1 small{color:var(--dim);font-weight:400;font-size:12px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;color:var(--dim);font-size:12px;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;direction:ltr;text-align:left}
textarea{min-height:70px;font-family:Consolas,monospace;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--txt);font-size:13px}
.chk input{width:auto}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--txt);border:1px solid var(--line)}
button.bad{background:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.big{width:100%;padding:14px;font-size:16px;margin-top:6px}
.status{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--dim)}
.dot.connected{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.connecting{background:var(--warn)}
.dot.error{background:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;text-align:center}
.stats div{background:var(--bg);border-radius:8px;padding:6px;font-size:12px;color:var(--dim)}
.stats b{display:block;color:var(--txt);font-size:14px;direction:ltr}
#log{height:130px;overflow:auto;background:var(--bg);border-radius:8px;padding:8px;font:11px/1.5 Consolas,monospace;direction:ltr;text-align:left;white-space:pre-wrap;color:var(--dim)}
.err{color:var(--bad);font-size:13px;margin-top:8px;word-break:break-word}
.hint{color:var(--dim);font-size:11px;margin-top:4px}
.bar{display:flex;gap:8px;margin-top:12px}
.bar>*{flex:1}
details summary{cursor:pointer;color:var(--dim);margin-top:12px}
</style>
</head>
<body>
<main>
<header>
  <h1>🔐 CK Client <small>SSH + UDPGW</small></h1>
  <button class="sec" id="quit" title="خروج کامل">خروج</button>
</header>

<div class="card">
  <div class="status"><span class="dot" id="dot"></span><b id="stText">قطع</b><span id="stSince" style="color:var(--dim);margin-inline-start:auto;direction:ltr"></span></div>
  <div class="stats"><div>آپلود<b id="up">0 B</b></div><div>دانلود<b id="down">0 B</b></div><div>لینک SSH<b id="link">-</b></div></div>
  <div class="err" id="err"></div>
  <label>پروفایل</label>
  <select id="sel"></select>
  <button class="big" id="go">اتصال</button>
</div>

<div class="card">
  <b id="formTitle">پروفایل جدید</b>
  <label>نام پروفایل</label><input id="name" placeholder="my-server">
  <div class="row">
    <div><label>آدرس سرور (IP یا دامنه)</label><input id="host" placeholder="1.2.3.4"></div>
    <div><label>پورت SSH</label><input id="port" type="number" value="22"></div>
  </div>
  <div class="row">
    <div><label>نام کاربری</label><input id="user" autocomplete="off"></div>
    <div><label>رمز عبور</label><input id="pass" type="password" autocomplete="new-password" placeholder="(بدون تغییر)"></div>
  </div>
  <details><summary>ورود با کلید خصوصی (اختیاری)</summary>
    <textarea id="key" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea>
    <div class="hint">کلید فقط روی همین کامپیوتر ذخیره می‌شود. کلید با passphrase پشتیبانی نمی‌شود.</div>
  </details>
  <div class="row">
    <div><label>نوع اتصال</label>
      <select id="mode"><option value="vpn">VPN کامل (همه برنامه‌ها)</option><option value="proxy">فقط پراکسی SOCKS5</option></select></div>
    <div><label>انتقال</label>
      <select id="transport"><option value="direct">SSH مستقیم</option><option value="tls">SSH روی TLS (SNI)</option></select></div>
  </div>
  <div class="row" id="sniRow" style="display:none"><div><label>SNI</label><input id="sni" placeholder="example.com"></div><div></div></div>
  <div class="chk"><input type="checkbox" id="udpgw" checked><label style="margin:0;color:inherit">فعال‌سازی UDPGW (بازی، تماس، DNS)</label></div>
  <div class="row">
    <div><label>آدرس UDPGW (از دید سرور)</label><input id="udpgwAddr" value="127.0.0.1:7300"></div>
    <div><label>DNS</label><input id="dns" value="1.1.1.1,8.8.8.8"></div>
  </div>
  <div class="row" id="socksRow" style="display:none"><div><label>پورت SOCKS5 محلی</label><input id="socksPort" type="number" value="10808"></div><div></div></div>
  <div class="bar">
    <button id="save">ذخیره</button>
    <button class="sec" id="new">جدید</button>
    <button class="bad" id="del">حذف</button>
  </div>
  <div class="bar"><button class="sec" id="forget">فراموش‌کردن اثر انگشت کلید سرور</button></div>
</div>

<div class="card"><b>گزارش</b><div id="log" style="margin-top:8px"></div></div>
</main>
<script>
const T = location.hash.slice(1);
const $ = id => document.getElementById(id);
const api = async (path, opt = {}) => {
  const r = await fetch(path, {...opt, headers: {'X-CK-Token': T, 'Content-Type': 'application/json'}});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const fmt = n => { n = n || 0; const u = ['B','KB','MB','GB','TB']; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toFixed(i ? 1 : 0) + ' ' + u[i]; };
const names = {idle:'قطع', connecting:'در حال اتصال...', connected:'متصل', error:'خطا'};
let profiles = [], state = {state:'idle'};

function fill(p) {
  p = p || {};
  $('formTitle').textContent = p.name ? 'ویرایش: ' + p.name : 'پروفایل جدید';
  $('name').value = p.name || ''; $('name').readOnly = !!p.name;
  $('host').value = p.host || ''; $('port').value = p.port || 22;
  $('user').value = p.user || ''; $('pass').value = ''; $('key').value = '';
  $('pass').placeholder = p.hasPassword ? '(ذخیره شده - بدون تغییر)' : '';
  $('mode').value = p.mode || 'vpn'; $('transport').value = p.transport || 'direct';
  $('sni').value = p.sni || ''; $('udpgw').checked = p.name ? !!p.udpgwEnabled : true;
  $('udpgwAddr').value = p.udpgwAddr || '127.0.0.1:7300';
  $('dns').value = (p.dns && p.dns.length ? p.dns : ['1.1.1.1','8.8.8.8']).join(',');
  $('socksPort').value = p.socksPort || 10808;
  toggles();
}
function toggles() {
  $('sniRow').style.display = $('transport').value === 'tls' ? '' : 'none';
  $('socksRow').style.display = $('mode').value === 'proxy' ? '' : 'none';
}
async function loadProfiles(keep) {
  profiles = await api('/api/profiles');
  const cur = keep || $('sel').value;
  $('sel').innerHTML = profiles.map(p => `<option>${p.name.replace(/[<&]/g, '')}</option>`).join('');
  if (profiles.some(p => p.name === cur)) $('sel').value = cur;
  fill(profiles.find(p => p.name === $('sel').value));
}
$('sel').onchange = () => fill(profiles.find(p => p.name === $('sel').value));
$('transport').onchange = $('mode').onchange = toggles;
$('new').onclick = () => { fill(null); $('name').focus(); };
$('save').onclick = async () => {
  try {
    const p = {name: $('name').value, host: $('host').value, port: +$('port').value, user: $('user').value,
      password: $('pass').value, privateKey: $('key').value, mode: $('mode').value, transport: $('transport').value,
      sni: $('sni').value, udpgwEnabled: $('udpgw').checked, udpgwAddr: $('udpgwAddr').value,
      dns: $('dns').value.split(',').map(s => s.trim()).filter(Boolean), socksPort: +$('socksPort').value};
    await api('/api/profiles', {method: 'POST', body: JSON.stringify(p)});
    await loadProfiles(p.name);
  } catch (e) { alert(e.message); }
};
$('del').onclick = async () => {
  const n = $('sel').value; if (!n || !confirm('حذف ' + n + '؟')) return;
  await api('/api/profiles?name=' + encodeURIComponent(n), {method: 'DELETE'}); await loadProfiles();
};
$('forget').onclick = async () => {
  const n = $('sel').value; if (!n) return;
  if (confirm('اثر انگشت کلید سرور پاک شود؟ در اتصال بعدی دوباره اعتماد می‌شود.')) await api('/api/forget-hostkey', {method: 'POST', body: JSON.stringify({name: n})});
};
$('go').onclick = async () => {
  const s = state.state;
  if (s === 'connected' || s === 'connecting') await api('/api/disconnect', {method: 'POST', body: '{}'});
  else if ($('sel').value) await api('/api/connect', {method: 'POST', body: JSON.stringify({name: $('sel').value})});
};
$('quit').onclick = async () => { await api('/api/quit', {method: 'POST', body: '{}'}).catch(() => {}); document.body.innerHTML = '<p style="text-align:center;margin-top:30vh">CK Client بسته شد. می‌توانید این پنجره را ببندید.</p>'; };

async function poll() {
  try {
    state = await api('/api/state');
    $('dot').className = 'dot ' + state.state;
    $('stText').textContent = names[state.state] + (state.active && state.state !== 'idle' ? ' — ' + state.active : '');
    $('up').textContent = fmt(state.up); $('down').textContent = fmt(state.down);
    $('link').textContent = state.state === 'connected' ? (state.link ? 'برقرار' : 'در حال وصل‌شدن مجدد') : '-';
    $('err').textContent = state.error || '';
    $('go').textContent = state.state === 'connected' || state.state === 'connecting' ? 'قطع اتصال' : 'اتصال';
    $('go').className = 'big' + (state.state === 'connected' ? ' bad' : '');
    $('stSince').textContent = state.state === 'connected' && state.since ? new Date(state.since * 1000).toLocaleTimeString() : '';
    const l = $('log'), atEnd = l.scrollTop + l.clientHeight >= l.scrollHeight - 5;
    l.textContent = (state.logs || []).join('\n'); if (atEnd) l.scrollTop = l.scrollHeight;
  } catch (e) {}
}
loadProfiles().then(() => { poll(); setInterval(poll, 1000); });
</script>
</body>
</html>
